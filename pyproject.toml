[project]
name = "ziada-mcp"
version = "0.1.0"
description = "MCP server + agent for the ZiadaPOS API — helps shop owners manage their store in natural language"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14,<3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
ziada-mcp = "ziada_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ziada_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
