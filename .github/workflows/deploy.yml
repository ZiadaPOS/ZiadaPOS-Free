name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv sync --group dev

      - name: Ruff check
        run: uvx ruff check src/ziada_mcp tests

      - name: Pytest
        run: uv run pytest -q

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync source to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          rsync -avz --delete \
            --exclude='.git' --exclude='.venv' --exclude='__pycache__' --exclude='*.pyc' \
            -e "ssh -p ${VPS_PORT}" \
            ./ ${VPS_USER}@${VPS_HOST}:~/ziadapos-go/ziadapos-agent/

      - name: Build & restart agent
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            'cd ~/ziadapos-go/deploy && docker compose build agent && docker compose up -d agent'

      - name: Verify agent is up
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          sleep 12
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            'cd ~/ziadapos-go/deploy && docker compose ps agent --format "{{.Name}} {{.Status}}"'
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            'docker exec ziadapos-go-agent-1 python -c "import socket,sys; s=socket.create_connection(('"'"'localhost'"'"',8081),timeout=5); s.close(); print('"'"'mcp port reachable'"'"')"'
