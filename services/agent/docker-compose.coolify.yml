services:
  agent:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-}
      APP_NAME: ${APP_NAME:-}
      DEBUG: ${DEBUG:-}
      PORT: ${PORT:-}
      API_BASE_PATH: ${API_BASE_PATH:-}
      SITE_URL: ${SITE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
      DB_SSLMODE: ${DB_SSLMODE:-}
      REDIS_ADDR: ${REDIS_ADDR:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-}
      MINIO_REGION: ${MINIO_REGION:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      MAILAFRICA_API_KEY: ${MAILAFRICA_API_KEY:-}
      MAILAFRICA_BASE_URL: ${MAILAFRICA_BASE_URL:-}
      MAILAFRICA_FROM_DOMAIN: ${MAILAFRICA_FROM_DOMAIN:-}
      MAILAFRICA_FROM_ADDRESS: ${MAILAFRICA_FROM_ADDRESS:-}
      MAILAFRICA_FROM_NAME: ${MAILAFRICA_FROM_NAME:-}
      SENDAFRICA_BASE_URL: ${SENDAFRICA_BASE_URL:-}
      SENDAFRICA_API_KEY: ${SENDAFRICA_API_KEY:-}
      SENDAFRICA_SENDER_ID: ${SENDAFRICA_SENDER_ID:-}
      NGAMIA_BASE_URL: ${NGAMIA_BASE_URL:-}
      NGAMIA_API_KEY: ${NGAMIA_API_KEY:-}
      NGAMIA_MODEL: ${NGAMIA_MODEL:-}
      DAILY_REPORT_HOUR: ${DAILY_REPORT_HOUR:-}
      DAILY_REPORT_MINUTE: ${DAILY_REPORT_MINUTE:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-}
      MCP_HOST: ${MCP_HOST:-}
      MCP_PORT: ${MCP_PORT:-}
      ZIADA_API_URL: ${ZIADA_API_URL:-}
      ZIADA_IDENTIFIER: ${ZIADA_IDENTIFIER:-}
      ZIADA_PASSWORD: ${ZIADA_PASSWORD:-}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    ports:
      - "8087:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.create_connection(('localhost',8081),timeout=5); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s