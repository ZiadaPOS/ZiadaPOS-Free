services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - /var/lib/docker/volumes/ziadapos-go_ziada_pg_data/_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - /var/lib/docker/volumes/ziadapos-go_ziada_redis_data/_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - /var/lib/docker/volumes/ziadapos-go_ziada_minio_data/_data:/data
    ports:
      - "9080:9000"
      - "9081:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mc-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    environment:
      MC_HOST_ziada: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until mc ls ziada/${MINIO_BUCKET} >/dev/null 2>&1; do
          i=$((i+1)); [ $i -gt 30 ] && echo "bucket never appeared" && exit 1
          sleep 2
        done
        mc anonymous set download ziada/${MINIO_BUCKET}
        echo "minio bucket public-read policy applied"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-}
      APP_NAME: ${APP_NAME:-}
      DEBUG: ${DEBUG:-}
      PORT: ${PORT:-}
      API_BASE_PATH: ${API_BASE_PATH:-}
      SITE_URL: ${SITE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
      DB_SSLMODE: ${DB_SSLMODE:-}
      REDIS_ADDR: ${REDIS_ADDR:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-}
      MINIO_REGION: ${MINIO_REGION:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SENDAFRICA_BASE_URL: ${SENDAFRICA_BASE_URL:-}
      SENDAFRICA_API_KEY: ${SENDAFRICA_API_KEY:-}
      SENDAFRICA_SENDER_ID: ${SENDAFRICA_SENDER_ID:-}
      NGAMIA_BASE_URL: ${NGAMIA_BASE_URL:-}
      NGAMIA_API_KEY: ${NGAMIA_API_KEY:-}
      NGAMIA_MODEL: ${NGAMIA_MODEL:-}
      DAILY_REPORT_HOUR: ${DAILY_REPORT_HOUR:-}
      DAILY_REPORT_MINUTE: ${DAILY_REPORT_MINUTE:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-}
      MCP_HOST: ${MCP_HOST:-}
      MCP_PORT: ${MCP_PORT:-}
      ZIADA_API_URL: ${ZIADA_API_URL:-}
      ZIADA_IDENTIFIER: ${ZIADA_IDENTIFIER:-}
      ZIADA_PASSWORD: ${ZIADA_PASSWORD:-}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    ports:
      - "8086:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/v1/health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10